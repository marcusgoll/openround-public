# OpenRound Phase 1 v0 — Seeed XIAO nRF52840 Sense (xiao_ble/nrf52840/sense).
# Symbols checked against Zephyr v4.4.2 sources on 2026-08-20 (see README).

# --- Onboard IMU (LSM6DS3TR-C, driven by the st,lsm6dsl driver) ---
# The board devicetree already models the IMU: node lsm6ds3tr_c@6a on the
# internal &i2c0 (TWIM, 400 kHz), power gated by a regulator-fixed node on
# P1.08 with regulator-boot-on (CONFIG_REGULATOR=y comes from the board
# defconfig), DRDY on P0.11 (irq-gpios). Nothing to add in the overlay.
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
# FS index: 16 -> +/-16 g (drivers/sensor/st/lsm6dsl/Kconfig)
CONFIG_LSM6DSL_ACCEL_FS=16
# ODR index 8 -> 1666 Hz, the target rate from docs/hardware-review.md.
# The driver's Kconfig table goes up to index 10 (6664 Hz), so the standard
# sensor API does NOT cap us below 1.6 kHz. Indexes 9/10 would outrun the
# 400 kHz I2C fetch path anyway.
CONFIG_LSM6DSL_ACCEL_ODR=8
# CONFIG_LSM6DSL_GYRO_ODR defaults to 0 = "runtime", which the driver init
# writes as ODR register 0 = gyro power-down. We want the gyro off; leave it.
CONFIG_LSM6DSL_TRIGGER_OWN_THREAD=y
CONFIG_LSM6DSL_THREAD_STACK_SIZE=2048
# Sampling thread must outrank the CSV-printing main thread (see below),
# otherwise a stalled USB write would starve sample capture.
CONFIG_LSM6DSL_THREAD_PRIORITY=5

# --- USB CDC-ACM console (the board routes zephyr,console to CDC-ACM) ---
# The XIAO board's Zephyr v4.4.2 backend uses the new USB device stack.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="OpenRound"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="OpenRound Phase1 Capture"
CONFIG_CDC_ACM_SERIAL_PID=0x0100
CONFIG_UART_CONSOLE=y
# Needed for uart_line_ctrl_get(): main waits for DTR so the T header line
# is not emitted into the void before a terminal is attached.
CONFIG_UART_LINE_CTRL=y
# ~57 KB/s of CSV at 1666 Hz; the matching 4 KiB CDC FIFOs are in app.overlay.

# --- Float formatting for the CSV lines (printk %.3f) ---
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# --- Minimal logging (driver errors ride the same USB console) ---
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# Main thread only formats and prints; it must NOT preempt the sampling
# thread (priority 5 above).
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_MAIN_STACK_SIZE=2048

# No BLE in v0.
CONFIG_BT=n
