[project]
name = "openround"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
description = "Open on-course golf shot tracking - Phase 0 data pipeline (Shot Scope liberation, open schema, roadmap auto-fill)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/marcusgoll/openround-public"
Issues = "https://github.com/marcusgoll/openround-public/issues"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openround"]

[tool.pytest.ini_options]
testpaths = ["tests"]
